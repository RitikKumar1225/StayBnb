[project]
name = "staybnb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.1",
    "Pillow>=11.0",
    "whitenoise>=6.6.0",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "staybnb.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
